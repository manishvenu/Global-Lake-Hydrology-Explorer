name: Tests

on:
  push:
    branches: [main]
    paths:
      - "GLHE/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # pint is pure-Python and required by GLHE/CLAY/__init__.py at import
      # time. CLAY/LIME tests need the full conda env (real data, C extensions)
      # so only the CALCITE tests run here.
      - name: Install test dependencies
        run: pip install pytest pint

      - name: Install GLHE package
        run: pip install --no-deps -e .

      - name: Run CALCITE unit tests
        run: pytest tests/test_CALCITE.py --tb=short -v
